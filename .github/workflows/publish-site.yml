# Keeps the live site in sync with this branch.
#
# Pages serves this repository from the `gh-pages` branch, so this workflow
# copies the site onto that branch whenever it changes. There is no build
# step — the files are published exactly as they are.
name: Publish site

on:
  push:
    branches: [claude/agency-marketing-website-zg3x64]
    paths:
      - index.html
      - style.css
      - script.js
      - orderbook-k7x2m9f4.html
      - admin.css
      - admin.js
      - setup-sql.html
      - setup-sql.js
      - assets/**
      - vendor/**
      - .github/workflows/publish-site.yml
  workflow_dispatch:

permissions:
  contents: write

# Never let two publishes race each other onto the same branch.
concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy the site onto gh-pages
        run: |
          set -euo pipefail

          # Stash the site before switching branches.
          staging="$(mktemp -d)"
          cp index.html style.css script.js "$staging/"
          cp orderbook-k7x2m9f4.html admin.css admin.js "$staging/"
          cp setup-sql.html setup-sql.js "$staging/"
          touch "$staging/.nojekyll"
          if [ -d assets ]; then
            cp -r assets "$staging/assets"
          fi
          if [ -d vendor ]; then
            cp -r vendor "$staging/vendor"
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages
          git checkout gh-pages

          cp "$staging/index.html" "$staging/style.css" \
             "$staging/script.js" "$staging/.nojekyll" \
             "$staging/orderbook-k7x2m9f4.html" "$staging/admin.css" "$staging/admin.js" \
             "$staging/setup-sql.html" "$staging/setup-sql.js" .

          # The order book used to publish as admin.html. Leaving that behind
          # would keep the guessable URL working and defeat the rename.
          git rm -f --ignore-unmatch admin.html

          # Replace assets wholesale so deleted files do not linger on the
          # live branch.
          rm -rf assets vendor
          if [ -d "$staging/assets" ]; then
            cp -r "$staging/assets" assets
          fi
          if [ -d "$staging/vendor" ]; then
            cp -r "$staging/vendor" vendor
          fi

          git add -A index.html style.css script.js .nojekyll assets vendor \
                     orderbook-k7x2m9f4.html admin.css admin.js \
                     setup-sql.html setup-sql.js

          if git diff --staged --quiet; then
            echo "gh-pages already matches ${GITHUB_SHA}; nothing to publish."
          else
            git commit -m "Publish ${GITHUB_SHA::7}"
            git push origin gh-pages
          fi
