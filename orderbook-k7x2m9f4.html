<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Order Book — WE3</title>

  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
  <!-- Solid icons only; Font Awesome Free ships an incomplete regular set. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>

<body class="adm is-locked">

  <!-- The gate. Everything else stays hidden behind CSS until an admin is
       signed in, so no customer data paints first.

       Unlike the password this page used to carry, this one is real: the
       sign-in is Supabase's, and the order rows are only readable by an
       account whose profile says is_admin. Editing this file gets nobody in. -->
  <div class="lock" id="lock" hidden>
    <form class="lock__card" id="lockForm">
      <span class="lock__badge">
        <img class="lock__logo" src="assets/we3-wordmark.png" alt="WE3" width="520" height="158" />
      </span>
      <h1 class="lock__title">Order Book</h1>
      <p class="lock__desc">Sign in with your WE3 account.</p>

      <div class="lock__field">
        <input class="input" type="text" id="lockUser" autocomplete="username"
               autocapitalize="none" spellcheck="false" placeholder="Username" />
      </div>

      <div class="lock__field pw">
        <input class="input" type="password" id="lockPw" autocomplete="current-password"
               placeholder="Password" />
        <button class="pw__eye" type="button" id="lockEye" aria-label="Show password">
          <i class="fa-solid fa-eye" aria-hidden="true"></i>
        </button>
      </div>

      <p class="lock__err" id="lockErr" hidden></p>

      <button class="btn btn--green btn--block" type="submit" id="lockBtn">
        <i class="fa-solid fa-unlock" aria-hidden="true"></i> Sign in
      </button>
    </form>
  </div>

  <!-- ======================================================================
       SHELL — sidebar + topbar. Everything below the lock screen.
       ====================================================================== -->
  <div class="shell">

    <!-- ---------- SIDEBAR ---------- -->
    <aside class="side" id="side" aria-label="Sections">
      <div class="side__brand">
        <img src="assets/we3-wordmark.png" alt="WE3" width="520" height="158" />
        <span>Admin Panel</span>
      </div>

      <nav class="side__nav" aria-label="Main">
        <a class="navit is-on" href="#dashboard"><i class="fa-solid fa-house" aria-hidden="true"></i><span>Dashboard</span></a>
        <a class="navit" href="#enquiries"><i class="fa-solid fa-file-lines" aria-hidden="true"></i><span>Enquiries</span><em class="navit__count" data-count="enquiries"></em></a>
        <a class="navit" href="#clients"><i class="fa-solid fa-user-group" aria-hidden="true"></i><span>Clients</span></a>
        <a class="navit" href="#orders"><i class="fa-solid fa-receipt" aria-hidden="true"></i><span>Orders</span><em class="navit__count" data-count="orders"></em></a>
        <a class="navit" href="#projects"><i class="fa-solid fa-folder-open" aria-hidden="true"></i><span>Projects</span></a>
        <a class="navit" href="#services"><i class="fa-solid fa-briefcase" aria-hidden="true"></i><span>Services</span></a>
        <a class="navit" href="#activity"><i class="fa-solid fa-wave-square" aria-hidden="true"></i><span>User Activity</span></a>
        <a class="navit" href="#team"><i class="fa-solid fa-users-gear" aria-hidden="true"></i><span>Team</span></a>
        <a class="navit" href="#analytics"><i class="fa-solid fa-chart-column" aria-hidden="true"></i><span>Analytics</span></a>
        <a class="navit" href="#settings"><i class="fa-solid fa-gear" aria-hidden="true"></i><span>Settings</span></a>
      </nav>

      <div class="side__quote">
        <p>&ldquo;Build.<br />Create.<br />Grow Together.&rdquo;</p>
        <span>— WE3</span>
      </div>
    </aside>

    <div class="side__scrim" id="sideScrim" hidden></div>

    <!-- ---------- MAIN ---------- -->
    <div class="main">

      <header class="topbar">
        <button class="topbar__burger" id="burger" aria-label="Open menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>

        <div class="search" role="search">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input id="globalSearch" type="search" autocomplete="off"
                 placeholder="Search anything… (name, phone, service, status)"
                 aria-label="Search everything" aria-expanded="false"
                 aria-controls="searchResults" />
          <kbd>Ctrl K</kbd>
          <div class="search__panel" id="searchResults" role="listbox" hidden></div>
        </div>

        <div class="topbar__right">
          <button class="iconbtn" id="bellBtn" aria-label="Notifications" aria-expanded="false">
            <i class="fa-solid fa-bell" aria-hidden="true"></i>
            <em class="iconbtn__dot" id="bellDot" hidden></em>
          </button>
          <div class="pop" id="bellPop" hidden>
            <div class="pop__head">
              <strong>Notifications</strong>
              <button class="pop__link" id="readAll">Mark all read</button>
            </div>
            <ul class="pop__list" id="bellList"></ul>
          </div>

          <button class="who" id="meBtn">
            <span class="who__avatar" id="whoAvatar">?</span>
            <span class="who__text">
              <strong id="whoami">Admin</strong>
              <em>WE3 Agency</em>
            </span>
            <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <!-- ======================================================================
       MY ACCOUNT — an admin's own details and password
       ====================================================================== -->
  <div class="modal" id="meModal" hidden>
    <div class="modal__backdrop" data-close-me></div>

    <div class="modal__dialog me" role="dialog" aria-modal="true" tabindex="-1" aria-labelledby="meTitle">
      <button class="modal__close" data-close-me aria-label="Close">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>

      <h2 class="modal__title" id="meTitle">Your account</h2>

      <div class="me__id">
        <strong id="meUser">—</strong>
        <span class="tag" id="meRole"></span>
      </div>
      <p class="me__since" id="meSince"></p>
      <p class="me__since" id="meLast"></p>

      <div class="fld">
        <label for="meName">Your name</label>
        <input class="inp" type="text" id="meName" autocomplete="name" placeholder="Your name" />
      </div>
      <div class="fld">
        <label for="mePhone">Phone number</label>
        <input class="inp" type="tel" id="mePhone" autocomplete="tel" inputmode="numeric" placeholder="Phone number" />
      </div>
      <p class="msg" id="meMsg" hidden></p>
      <button class="btn btn--green btn--block" id="meSave">
        <i class="fa-solid fa-check" aria-hidden="true"></i> Save
      </button>

      <h3 class="me__h">Password</h3>
      <div class="fld">
        <label for="mePass">New password</label>
        <div class="pw">
          <input class="inp" type="password" id="mePass" autocomplete="new-password"
                 placeholder="At least 8 characters" />
          <button class="pw__eye" type="button" id="meEye" aria-label="Show password">
            <i class="fa-solid fa-eye" aria-hidden="true"></i>
          </button>
        </div>
      </div>
      <p class="msg" id="mePassMsg" hidden></p>
      <button class="btn btn--ghost btn--block" id="mePassBtn">
        <i class="fa-solid fa-key" aria-hidden="true"></i> Change password
      </button>

      <button class="btn btn--ghost btn--block" id="signOutBtn">
        <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i> Sign out
      </button>
    </div>
  </div>

  <!-- A drawer for record details, and a place for toasts. Both are filled
       in by admin.js so there is one of each rather than one per section. -->
  <div class="drawer" id="drawer" hidden>
    <div class="drawer__backdrop" data-close-drawer></div>
    <aside class="drawer__panel" role="dialog" aria-modal="true" tabindex="-1" aria-labelledby="drawerTitle">
      <header class="drawer__head">
        <h2 id="drawerTitle">Details</h2>
        <button class="iconbtn" data-close-drawer aria-label="Close">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </header>
      <div class="drawer__body" id="drawerBody"></div>
    </aside>
  </div>

  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
  <script src="admin.js" defer></script>
</body>
</html>
